<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Sidebar</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!------------------------------------------------------------------ SIDEBAR ------------------------------------- -->
    <div class="d-flex">
        <div class="sidebar shadow-lg bg-light" style="width: 300px; height: 100vh; position: fixed; top: 0; left: 0; padding-top: 20px; box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);">
            <div class="brand d-flex align-items-center mb-4 px-3" style="font-size: 1.5rem;">
                <i class="fa-solid fa-copyright" style="font-size: 2rem; margin-right: 10px;"></i>
                <span style="font-weight: bold; color: #333;">Uptake Infotech</span>
            </div>
            <ul class="nav flex-column py-3">
                <li class="nav-item">
                    <a class="nav-link fs-5 py-3" href="#" id="listUser">
                        <i class="fas fa-users me-2"></i>List User
                    </a>
                    <a class="nav-link fs-5 py-3" href="#" id="addUser">
                        <i class="fas fa-user-plus me-2"></i>Add User
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fs-5 py-3" href="#" id="statistics">
                        <i class="fas fa-chart-bar me-2"></i>Statistics
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!------------------------------------------------------------------ LIST USER SECTION ------------------------------------- -->
    <div class="content" style="margin-left: 300px; padding: 20px; height: 100vh;">
        <div id="listUserContainer" class="container p-5 shadow-lg bg-white rounded-4" style="height: 100%;">
            <h2 class="text-center mb-4">All Users</h2>
            <div class="input-group mb-4">
                <div class="input-group mb-4">
                    <input type="search" class="form-control rounded p-3" placeholder="Search" aria-label="Search" id="searchInput">
                </div>
            </div>
            <table class="table table-striped table-bordered table-hover shadow-sm">
                <thead>
                    <tr>
                        <th>Sr.No</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Message</th>
                        <th>Gender</th>
                        <th>Actions</th>
                        <th>Status</th>
                        
                    </tr>
                </thead>
                <tbody id="userListBody">
                </tbody>
            </table>
        </div>

        <!------------------------------------------------------------------ STATISTICS SECTION ------------------------------------- -->
        <div class="container p-5 bg-white bg-opacity-75 rounded-3" id="statisticsContainer" style="height: 100%; display: none;">
            <h2 class="text-center mb-4">Statistics</h2>
            <canvas id="myChart"></canvas>
        </div>
    
        <!------------------------------------------------------------------ FORM SECTION ------------------------------------- -->
        <div class="container mx-auto bg-white v p-5 rounded-3" id="userFormContainer" style="margin-left: 300px;display: none;height: 100%;">
            <form id="myForm">
                <div class="row">
                    <!-- First Column -->
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">
                            <i class="fas fa-user"></i> Name*
                        </label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your full name">
                        <span id="nameError" class="text-danger"></span>
                    </div>
        
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i> Email*
                        </label>
                        <input type="text" class="form-control" id="email" placeholder="Enter your email">
                        <span id="emailError" class="text-danger"></span>
                    </div>
                </div>
        
                <div class="row">
                    <!-- Second Column -->
                    <div class="col-md-6 mb-3">
                        <label for="phone" class="form-label">
                            <i class="fas fa-phone"></i> Phone*
                        </label>
                        <input type="text" class="form-control" id="phone" placeholder="Enter your phone number">
                        <span id="phoneError" class="text-danger"></span>
                    </div>
        
                    <div class="col-md-6 mb-3">
                        <label for="gender" class="form-label">
                            <i class="fas fa-venus-mars"></i> Gender*
                        </label>
                        <select id="gender" class="form-select">
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                        <span id="genderError" class="text-danger"></span>
                    </div>
                </div>
        
                <div class="row">
                    <!-- Third Column -->
                    <div class="col-md-6 mb-3">
                        <label for="age" class="form-label">
                            <i class="fas fa-birthday-cake"></i> Age*
                        </label>
                        <input type="number" class="form-control" id="age" placeholder="Enter your age">
                        <span id="ageError" class="text-danger"></span>
                    </div>
        
                    <div class="col-md-6 mb-3">
                        <label for="message" class="form-label">
                            <i class="fas fa-comment"></i> Message*
                        </label>
                        <textarea class="form-control" id="message" rows="3" placeholder="Enter your message"></textarea>
                        <span id="messageError" class="text-danger"></span>
                    </div>
                </div>
        
                <div class="d-flex mt-3">
                    <button type="submit" class="btn btn-primary w-100" style="background: linear-gradient(45deg, #6a11cb, #2575fc); border-radius: 12px; border: none; height: 50px; margin-right: 10px;">
                        Save
                    </button>
                    <button type="button" id="cancelButton" class="btn btn-danger w-100" style="background: linear-gradient(45deg, #ff6a00, #ee0979); border-radius: 12px; border: none; height: 50px;">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
        
    <!------------------------------- DELETE CONFIRMATION BOOTSTRAP MODAL ------------------------------------------>
    
    <div class="modal fade" id="deleteConfirmationModal" tabindex="-1" aria-labelledby="deleteConfirmationLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteConfirmationLabel">Confirm Deletion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this user?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../Js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
