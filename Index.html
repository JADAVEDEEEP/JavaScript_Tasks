<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Sidebar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!------------------------------------------------------------------SIDEBAR------------------------------------- -->
    <div class="d-flex">
        <div class="sidebar shadow-lg bg-light" style="width: 300px; height: 100vh; position: fixed; top: 0; left: 0; padding-top: 20px; box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);">
            <div class="brand d-flex align-items-center mb-4" style="padding: 10px; font-size: 1.5rem;">
                <i class="fa-solid fa-copyright" style="font-size: 2rem; margin-right: 10px;"></i>
                <span style="font-weight: bold; color: #333;">Uptake Infotech</span>
            </div>
            <ul class="nav flex-column py-5">
                <li class="nav-item">
                    <a class="nav-link fs-5 py-3" href="#" id="List_user">
                        <i class="fas fa-users me-2"></i>List User
                    </a>
                    <a class="nav-link  fs-5 py-3" href="#" id="Add_user">
                        <i class="fas fa-user-plus me-2"></i>Add User
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fs-5 py-3" href="#" id="Statistics">
                        <i class="fas fa-chart-bar me-2"></i>Statistics
                    </a>
                </li>
            </ul>
        </div>
    </div>
    

      <!------------------------------------------------------------------ LIST USER SECTION------------------------------------- -->
      <div class="content" style="margin-left: 250px; padding: 20px; height: 100vh;">
        <div id="listUserContainer" class="container p-5 shadow-lg" style="background-color: rgba(255, 255, 255, 0.7); height: 100%; display: block; border-radius: 11px;">
            <h2 class="text-center mb-4">List of Users</h2>
            <!-- Example User List -->
            <table class="table">
                <thead>
                    <tr>
                        <th>Sr.No</th> 
                        <th>Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Message</th>
                        <th>Gender</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userListBody">
                    
                    </tr>
                </tbody>
            </table>
        </div>

         <!------------------------------------------------------------------ STATISTICS SECTION ------------------------------------- -->
         <div class="container p-5" style="background-color: rgba(255, 255, 255, 0.7); height: 100%; display: none; border-radius: 11px;" id="statisticsContainer">
            <h2 class="text-center mb-4">Statistics</h2>
            <canvas id="myChart"></canvas>
        </div>
    
        <!------------------------------------------------------------------ FORM SECTION------------------------------------- -->
        <div class="container p-5 " style="background-color: rgba(255, 255, 255, 0.7); height: 100%; display: none; border-radius:11px;" id="userFormContainer">
            <form id="myForm">
                <div class="mb-4"> <!-- Increased margin bottom for spacing -->
                    <label for="name" class="form-label text-yellow">
                        <i class="fas fa-user"></i> Name*
                    </label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your full name">
                    <span id="name_error" style="color: red;"></span>
                </div>
                <div class="mb-4"> 
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i> Email*
                    </label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    <span id="email_error" style="color: red;"></span>
                </div>
                <div class="mb-4 position-relative text-blue"> 
                    <label for="gender">
                        <i class="fas fa-venus-mars"></i> Gender*
                    </label>
                    <select id="gender" class="form-select">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                    <span id="gender_error" style="color: red;"></span>
                </div>
                <div class="mb-4"> 
                    <label for="age" class="form-label">
                        <i class="fas fa-birthday-cake"></i> Age*
                    </label>
                    <input type="number" class="form-control" id="age" placeholder="Enter your age">
                    <span id="age_error" style="color: red;"></span>
                </div>
                <div class="mb-4">
                    <label for="message" class="form-label">
                        <i class="fas fa-comment"></i> Message*
                    </label>
                    <textarea class="form-control" id="message" rows="3" placeholder="Enter your message"></textarea>
                    <span id="message_error" style="color: red;"></span>
                </div>
                <button type="submit" class="btn btn-primary" style="background: linear-gradient(45deg, #6a11cb, #2575fc); border-radius: 12px; border: none; color: white; width: 100px;height:50px;">Save</button>
                <button type="button" id="cancelButton" class="btn btn-primary" style="background: linear-gradient(45deg, #ff6a00, #ee0979); border-radius: 12px; border: none; color: white; width: 100px; height:50px; display: none;">Cancel</button>
                
            </form>
        </div>
    </div>
    <!-------------------------------  --------------------------------DELETE CONFORMATION BOOSTRAP MODAL---------------------------------------------------------------------->
        </div>
        <div class="modal fade" id="deleteConfirmationModal" tabindex="-1" aria-labelledby="deleteConfirmationLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteConfirmationLabel">Confirm Deletion</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Are you sure you want to delete this user?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
                    </div>
                </div>
            </div>
        </div>
        
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
