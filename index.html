<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Design</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body style="background: linear-gradient(135deg, #ff9a9e, #fad0c4); display: flex; justify-content: center; align-items: center; margin: 0;">

    <div class="container" style="max-width: 800px; width: 100%; padding: 20px;">
        <div class="justify-content-center">

            <div class="mb-4">
                <div class="container p-3 bg-white shadow-lg ">
                    <form id="myForm">
                        <h3 class="text-center mb-3" style="color: #333; font-size: 1.5rem;">Add Product</h3>

                        <div class="mb-3">
                            <label for="name" class="form-label" style="font-size: 0.875rem;">Name</label>
                            <input type="text" class="form-control form-control-sm" id="name" placeholder="Product Name">
                            <span id="nameError" class="text-danger" style="font-size: 0.75rem;"></span>
                        </div>

                        <div class="mb-3">
                            <label for="color" class="form-label" style="font-size: 0.875rem;">Color</label>
                            <input type="text" class="form-control form-control-sm" id="color" placeholder="Product Color">
                            <span id="errorColor" class="text-danger" style="font-size: 0.75rem;"></span>
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label" style="font-size: 0.875rem;">Category</label>
                            <input type="text" class="form-control form-control-sm" id="category" placeholder="Product Category">
                            <span id="errorCategory" class="text-danger" style="font-size: 0.75rem;"></span>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label" style="font-size: 0.875rem;">Price</label>
                            <input type="text" class="form-control form-control-sm" id="price" placeholder="Product Price">
                            <span id="errorPrice" class="text-danger" style="font-size: 0.75rem;"></span>
                        </div>

                        <div class="text-start">
                            <button type="submit" class="btn btn-primary btn-sm" id="submitBtn" style="padding: 5px 10px; font-size: 0.875rem;">Submit</button>
                            <span id="message" class="text-danger" style="font-size: 0.75rem;"></span>
                        </div>
                    </form>
                </div>
            </div>

            <div class="mb-4">
                <div class="container p-3 bg-white shadow-lg ">
                    <h2 class="text-center mb-4 text-primary" style="font-size: 1.5rem;">Product Details</h2>

            
                    <div class="table-responsive">
                        <table class="table table-striped table-bordered table-hover shadow-sm" style="font-size: 1rem; width: 100%;">
                            <thead class="thead-light">
                                <tr>
                                    <th style="padding: 12px 15px;">Sr.no</th>
                                    <th style="padding: 12px 15px;">Name</th>
                                    <th style="padding: 12px 15px;">Color</th>
                                    <th style="padding: 12px 15px;">Category</th>
                                    <th style="padding: 12px 15px;">Price</th>
                                    <th style="padding: 12px 15px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="userListBody">

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>



</html>
