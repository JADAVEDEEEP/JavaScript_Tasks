<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Design</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body style="background: linear-gradient(135deg, #ff9a9e, #fad0c4); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0;">

    <div class="container">
        <div class="row w-100">
            <!-- Form Section -->
            <div class="col-md-6 mb-4">
                <div class="container p-4 bg-white shadow-lg rounded">
                    <form id="myForm">
                        <h3 class="text-center mb-4" style="color: #333;">Add Product</h3>

                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" placeholder="Product Name">
                            <span id="nameError" class="text-danger" style="font-size: 0.875rem;"></span>
                        </div>

                        <div class="mb-3">
                            <label for="color" class="form-label">Color</label>
                            <input type="text" class="form-control" id="color" placeholder="Product Color">
                            <span id="errorColor" class="text-danger" style="font-size: 0.875rem;"></span>
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <input type="text" class="form-control" id="category" placeholder="Product Category">
                            <span id="errorCategory" class="text-danger" style="font-size: 0.875rem;"></span>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">Price</label>
                            <input type="text" class="form-control" id="price" placeholder="Product Price">
                            <span id="errorPrice" class="text-danger" style="font-size: 0.875rem;"></span>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary w-100">Submit</button>
                        </div>
                    </form>
                </div>
            </div>


            <div class="col-md-6">
                <div class="container p-4 bg-white shadow-lg rounded">
                    <h2 class="text-center mb-4">Products Details</h2>
                    <table class="table table-striped table-bordered table-hover shadow-sm">
                        <thead>
                            <tr>
                                <th>Sr.No</th>
                                <th>Name</th>
                                <th>Color</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userListBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
